# Release를 publish하면 module.json과 module.zip을 만들어 그 Release에 첨부한다.
#
# - 태그 형식: "v1.2.3" 또는 "1.2.3"
# - 저장소의 module.json은 템플릿이다. version, url, manifest, download는 여기서 채운다.
# - Release를 "수정"할 때는 실행되지 않고, "publish"할 때만 실행된다.
name: Release Module

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name }}
  # Foundry가 업데이트를 확인할 때 쓰는 주소. 항상 최신 Release를 가리키므로 바뀌면 안 된다.
  MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/module.json
  DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip
  PROJECT_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fill manifest
        run: |
          version="${TAG#v}"
          jq \
            --arg version "$version" \
            --arg url "$PROJECT_URL" \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json
          cat module.json

      - name: Create module.zip
        run: zip -r module.zip module.json README.md LICENSE scripts styles

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" module.json module.zip --clobber
